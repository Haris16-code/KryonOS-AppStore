name: Auto-Generate App Registry

on:
  push:
    branches:
      - main
    paths:
      - 'categories/**'
      - 'scripts/generate-registry.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Exact Raw Bytes)
        uses: actions/checkout@v4

      - name: Disable Git Line-Ending Mutation
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Registry Generator Script
        run: node scripts/generate-registry.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add index.json categories/
          
          if git diff --staged --quiet; then
            echo "No changes to the registry or hashes detected."
          else
            git commit -m "chore: auto-update OS app registry and SHA-256 hashes"
            git push
          fi
